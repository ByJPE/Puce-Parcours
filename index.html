<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puce &amp; Parcours</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe8ff;touch-action:none;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#ui,#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}

button.alt{background:#7fc8ff;box-shadow:0 4px 0 #4a98d0}
</style></head><body>
<canvas id="c"></canvas>
<div id="ctl"><button id="bl">◀</button><button id="br">▶</button></div>
<div id="ui"></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ui=document.getElementById('ui'),ctl=document.getElementById('ctl');
let S,LW;
function rs(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;S=cv.height/600;LW=cv.width/S}
addEventListener('resize',rs);rs();
const NAMES=['Jardin enchanté','Forêt de feuilles','Prairie dorée','Rivière aux nénuphars','Village fleuri','Collines de nuages','Cité des lanternes','Toits de la ville','Falaises de cristal','Sommet du Merveille'];
let sv={best:0,max:1};try{sv=Object.assign(sv,JSON.parse(localStorage.getItem('puce')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('puce',JSON.stringify(sv))}catch(e){}}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GY=500;var tiltMsg='';
let st='menu',L,P,n=0,score=0,lives=3,t=0,bn=0,jb=0,tilt=0,tiltOn=false,tiltPref=true,keys={l:0,r:0},btn={l:0,r:0},last=0,hasTilt=false;

function build(k){
 const R=rng(k*13+5);
 L={n:k,len:3000+k*380,gr:[],pl:[],co:[],en:[],fb:[],pt:[]};
 let x=-300,first=1;
 while(x<L.len+500){
  const w=first?800:280+R()*260;L.gr.push([x,x+w]);x+=w;first=0;
  if(x<L.len-300)x+=70+k*7+R()*40;
 }
 for(let px=380;px<L.len-100;px+=210+R()*150){
  const w=90+k*5+R()*40,y=380+R()*70,mv=R()<.15+k*.04;
  const p={x:px,bx:px,y,w,r:mv?50+R()*40:0,ph:R()*6,dx:0};L.pl.push(p);
  const nc=2+(k>4?1:0);
  for(let i=0;i<nc;i++)L.co.push({x:px+w/(nc+1)*(i+1),y:y-26,got:0,neon:R()<.2});
 }
 for(let i=0;i<8+k*3;i++){const gx=300+R()*(L.len-500);L.co.push({x:gx,y:GY-30-Math.sin(i)*20,got:0,neon:R()<.25})}
 const pEn=Math.min(.95,.4+k*.07);
 L.gr.forEach((s,i)=>{
  if(s[1]<500||s[0]>L.len-200)return;
  const c=(s[0]+s[1])/2,cnt=R()<pEn?1:0,ex=(k>5&&R()<.5)?1:0;
  for(let j=0;j<cnt+ex;j++){
   const ty=Math.min(2,(R()*(1+Math.min(2,k*.5+.8)))|0);
   L.en.push({x:c+(j?60:0),y:GY-24,w:26,h:24,vx:ty==0?(2+k*.12):(1),vy:0,t:R()*100|0,ty,a:Math.max(s[0]+20,0),b:s[1]-20,alive:1,dir:1});
  }
 });
}
function start(k){
 n=k;build(k);P={x:60,y:420,vx:0,vy:0,w:40,h:40,og:0,inv:60,face:1,safe:60};
 st='play';bn=170;setUI();
}
function hurt(){
 if(P.inv>0)return;lives--;P.inv=100;P.vy=-8;P.vx=-P.face*4;
 for(let i=0;i<10;i++)part(P.x+20,P.y+20,'#ff5a7a');
 if(lives<=0){st='over';if(score>sv.best)sv.best=score;save();setUI()}
}
function part(x,y,c){L.pt.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*5,l:30,c})}
function die(){
 lives--;
 if(lives<=0){st='over';if(score>sv.best)sv.best=score;save();setUI();return}
 P.x=Math.max(60,P.safe-40);P.y=300;P.vy=0;P.vx=0;P.inv=100;
}
function update(dt){
 t+=dt;const k=L.n,max=3.2+k*.3;
 L.pl.forEach(p=>{const o=p.x;p.x=p.bx+Math.sin(t*.03+p.ph)*p.r;p.dx=p.x-o});
 let ax=(keys.r||btn.r?1:0)-(keys.l||btn.l?1:0);
 if(tiltOn&&tiltPref)ax=Math.abs(tilt)<3?0:Math.max(-1,Math.min(1,tilt/22));
 if(ax)P.face=ax>0?1:-1;
 P.vx+=(ax*max-P.vx)*.14*dt;
 if(jb>0){jb-=dt;if(P.og){P.vy=-12.8;P.og=0;jb=0;for(let i=0;i<8;i++)part(P.x+20,P.y+40,'#fff3a0')}}
 const pb=P.y+P.h;P.vy+=.6*dt;P.y+=P.vy*dt;P.x+=P.vx*dt;if(P.x<0){P.x=0;P.vx=0}
 const b=P.y+P.h;let og=0;
 for(const s of L.gr)if(P.x+P.w>s[0]&&P.x<s[1]&&pb<=GY+3&&b>=GY&&P.vy>=0){P.y=GY-P.h;P.vy=0;og=1;P.safe=P.x}
 for(const p of L.pl)if(P.x+P.w>p.x&&P.x<p.x+p.w&&pb<=p.y+6&&b>=p.y&&P.vy>=0){P.y=p.y-P.h;P.vy=0;og=1;P.x+=p.dx}
 P.og=og;if(P.inv>0)P.inv-=dt;
 if(P.y>700){die();return}
 for(const c of L.co)if(!c.got&&Math.abs(c.x-P.x-20)<28&&Math.abs(c.y-P.y-20)<32){c.got=1;score+=c.neon?50:10;for(let i=0;i<6;i++)part(c.x,c.y,c.neon?'#39ff14':'#ffd23a')}
 for(const e of L.en){
  if(!e.alive)continue;e.t+=dt;
  if(e.ty==0){e.x+=e.vx*e.dir*dt;if(e.x<e.a)e.dir=1;if(e.x>e.b)e.dir=-1}
  else if(e.ty==1){e.x+=e.vx*e.dir*dt;if(e.x<e.a)e.dir=1;if(e.x>e.b)e.dir=-1;
   e.vy+=.6*dt;e.y+=e.vy*dt;if(e.y>=GY-e.h){e.y=GY-e.h;e.vy=0;if(e.t>80){e.vy=-10;e.t=0}}}
  else if(Math.abs(e.x-P.x)<LW*.6&&e.t>130){e.t=0;L.fb.push({x:e.x,y:e.y+8,vx:(P.x<e.x?-1:1)*(3+k*.2)})}
  if(P.x+P.w>e.x&&P.x<e.x+e.w&&P.y+P.h>e.y&&P.y<e.y+e.h){
   if(P.vy>0&&pb<=e.y+14){e.alive=0;P.vy=-9;score+=100;for(let i=0;i<10;i++)part(e.x+13,e.y+10,'#b06bff')}else hurt();
   if(st!=='play')return;
  }
 }
 for(const f of L.fb){f.x+=f.vx*dt;if(Math.abs(f.x-P.x-20)<20&&Math.abs(f.y-P.y-20)<24){f.x=-9999;hurt();if(st!=='play')return}}
 L.fb=L.fb.filter(f=>Math.abs(f.x-P.x)<LW);
 L.pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.25*dt;p.l-=dt});L.pt=L.pt.filter(p=>p.l>0);
 if(bn>0)bn-=dt;
 if(P.x>=L.len){
  score+=200+lives*50;lives=Math.min(5,lives+1);
  if(n>=9){st='win';sv.max=10}else{sv.max=Math.max(sv.max,n+2);start(n+1)}
  if(score>sv.best)sv.best=score;save();setUI();
 }
}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function draw(){
 g.setTransform(S,0,0,S,0,0);
 const k=L?L.n:0,h=200+k*16,gr=g.createLinearGradient(0,0,0,600);
 const T=TH[k];gr.addColorStop(0,T.s[0]);gr.addColorStop(1,T.s[1]);g.fillStyle=gr;g.fillRect(0,0,LW,600);
 const cam=P?P.x+P.w/2-LW/2:t;
 for(let l=0;l<2;l++){
  g.fillStyle=T.h[l];const sp=l?.55:.25;
  for(let i=-1;i<LW/220+2;i++){const bx=i*220-((cam*sp)%220);g.beginPath();g.ellipse(bx+110,500,130,90+l*40+((i*37)&31),0,Math.PI,0);g.fill()}
 }
 deco(k,cam);g.fillStyle=T.c;
 for(let i=-1;i<LW/260+2;i++){const bx=i*260-((cam*.12+t*.2)%260);g.beginPath();g.ellipse(bx+80,90+(i*53&63),50,16,0,0,7);g.ellipse(bx+110,80+(i*53&63),32,14,0,0,7);g.fill()}
 if(!L){g.fillStyle='#fff';g.fillRect(0,GY,LW,100);return}
 g.lineWidth=3;g.strokeStyle='#5a4a6a';
 for(const s of L.gr){const x=s[0]-cam;if(x>LW||s[1]-cam<0)continue;
  g.fillStyle=T.g[0];g.fillRect(x,GY,s[1]-s[0],110);g.fillStyle=T.g[1];g.fillRect(x,GY,s[1]-s[0],14);g.strokeRect(x,GY,s[1]-s[0],110)}
 for(const p of L.pl){const x=p.x-cam;if(x>LW||x+p.w<0)continue;g.fillStyle=p.r?'#ffc27a':'#c4a3ff';rr(x,p.y,p.w,14,7);g.fill();g.stroke()}
 for(const c of L.co){if(c.got)continue;const x=c.x-cam;if(x<-20||x>LW+20)continue;
  g.fillStyle=c.neon?'#39ff14':'#ffd23a';g.shadowColor=c.neon?'#39ff14':'#ffb300';g.shadowBlur=c.neon?12:4;
  g.beginPath();g.arc(x,c.y+Math.sin(t*.1+c.x)*3,8,0,7);g.fill();g.shadowBlur=0;g.stroke()}
 const fx=L.len-cam;g.fillStyle='#5a4a6a';g.fillRect(fx,GY-120,5,120);g.fillStyle='#ff5a7a';g.beginPath();g.moveTo(fx+5,GY-120);g.lineTo(fx+55,GY-100);g.lineTo(fx+5,GY-80);g.fill();
 for(const e of L.en){if(!e.alive)continue;const x=e.x-cam;if(x<-40||x>LW+40)continue;
  mouse(x,e);
  }
 for(const f of L.fb){const x=f.x-cam;g.fillStyle='#ff6a00';g.shadowColor='#ff0';g.shadowBlur=10;g.beginPath();g.arc(x,f.y,7,0,7);g.fill();g.shadowBlur=0}
 for(const p of L.pt){g.fillStyle=p.c;g.globalAlpha=p.l/30;g.fillRect(p.x-cam,p.y,4,4);g.globalAlpha=1}
 if(P&&!(P.inv>0&&((t|0)%6<3)))cat(LW/2-20,P.y);
 // HUD
 g.fillStyle='rgba(255,255,255,.78)';g.fillRect(0,0,LW,74);g.fillStyle='#3a3050';g.font='700 20px system-ui';g.textAlign='left';
 g.fillText('❤'.repeat(lives)+'  ⭐ '+score,14,40+(innerHeight>700?10:0));
 g.textAlign='right';g.fillText('Niv. '+(n+1)+'/10',LW-14,40+(innerHeight>700?10:0));
 g.textAlign='center';g.font='600 14px system-ui';g.fillText(tiltMsg,LW/2,66);
 if(bn>0&&st==='play'){g.fillStyle='rgba(255,255,255,.85)';g.fillRect(0,162,LW,52);g.fillStyle='#3a3050';g.font='800 30px system-ui';g.fillText(NAMES[n],LW/2,200)}
 if(st!=='play'){g.fillStyle='rgba(255,255,255,.7)';g.fillRect(0,0,LW,600);g.fillStyle='#3a3050';g.font='800 38px system-ui';
  g.fillText(st==='over'?'Perdu !':'Bravo !',LW/2,230);g.font='600 20px system-ui';g.fillText('Score '+score+'  ·  Record '+sv.best,LW/2,270)}
}
const TH=[
{s:['#bfe8ff','#e8f7e4'],h:['#c9ecc0','#9fdc9f'],g:['#c9a17a','#8fe08f'],c:'rgba(255,255,255,.85)'},
{s:['#ffd9a0','#fff1d6'],h:['#e8a86a','#c9783a'],g:['#a8723c','#e0903a'],c:'rgba(255,240,220,.7)'},
{s:['#ffe27a','#fff8d6'],h:['#f2d77a','#e0b94a'],g:['#c99a52','#e8c85a'],c:'rgba(255,255,255,.8)'},
{s:['#a8e6f0','#d8f6f2'],h:['#8fd4c0','#5fb8a0'],g:['#7a9a6a','#5fc58a'],c:'rgba(255,255,255,.85)'},
{s:['#ffd1e8','#fff0f6'],h:['#f5b8d6','#e08fbd'],g:['#c9a08a','#ffb0cc'],c:'rgba(255,255,255,.9)'},
{s:['#8fbfff','#f0f6ff'],h:['#dfe9ff','#c3d4f5'],g:['#b8c4e0','#ffffff'],c:'rgba(255,255,255,.95)'},
{s:['#2a1f5a','#8a3a8a'],h:['#4a3a7a','#3a2a6a'],g:['#4a3a5a','#9a5ad8'],c:'rgba(255,255,255,.12)'},
{s:['#ff9a6a','#ffe0a8'],h:['#9a6a8a','#6a4a6a'],g:['#5a4a5a','#9a8a9a'],c:'rgba(255,230,210,.6)'},
{s:['#c0f0ff','#ece0ff'],h:['#b0d8f0','#9ab8e8'],g:['#8aa0c8','#c8f0ff'],c:'rgba(255,255,255,.8)'},
{s:['#1a1040','#ff9ad0'],h:['#6a5a9a','#4a3a7a'],g:['#e0d8f8','#ffffff'],c:'rgba(255,255,255,.2)'}];
function deco(k,cam){
 const W=LW,m=(a,b)=>((a%b)+b)%b;
 const ti=(sp,sz,f)=>{const o=cam*sp,j0=Math.floor(o/sz);for(let i=-1;i<W/sz+2;i++){const j=j0+i;f(j*sz-o,j)}};
 const stars=n=>{g.fillStyle='#fff';for(let i=0;i<n;i++){g.globalAlpha=.5+.5*Math.sin(t*.05+i);g.fillRect((i*131)%W,(i*53)%330,2.5,2.5)}g.globalAlpha=1};
 g.lineWidth=2;
 if(k==0){g.fillStyle='#fff5a0';g.beginPath();g.arc(W-70,100,34,0,7);g.fill();
  ti(.6,90,(x,j)=>{g.strokeStyle='#4a9a4a';g.beginPath();g.moveTo(x+20,505);g.lineTo(x+20,486);g.stroke();g.fillStyle=['#ff8fb1','#ffd23a','#fff'][m(j,3)];g.beginPath();g.arc(x+20,483,6,0,7);g.fill()})}
 if(k==1){ti(.45,160,(x,j)=>{g.fillStyle='#7a4a2a';g.fillRect(x+60,330,26,172);g.fillStyle=['#e8742a','#d9a02a','#c9402a'][m(j,3)];g.beginPath();g.arc(x+73,320,56,0,7);g.arc(x+45,350,36,0,7);g.arc(x+101,350,36,0,7);g.fill()});
  g.fillStyle='#e8742a';for(let i=0;i<14;i++){const lx=m(i*137+t*(.6+i%3*.25),W+40)-20,ly=m(i*83+t*(1+i%4*.3),620);g.beginPath();g.ellipse(lx,ly,5,3,t*.05+i,0,7);g.fill()}}
 if(k==2){const sx=W*.72;g.strokeStyle='rgba(255,200,60,.5)';g.lineWidth=4;for(let i=0;i<12;i++){const a=i*Math.PI/6+t*.01;g.beginPath();g.moveTo(sx+Math.cos(a)*58,130+Math.sin(a)*58);g.lineTo(sx+Math.cos(a)*85,130+Math.sin(a)*85);g.stroke()}
  g.fillStyle='#ffc93a';g.beginPath();g.arc(sx,130,46,0,7);g.fill();
  ti(.9,36,(x,j)=>{g.strokeStyle='#b8902a';g.lineWidth=2;g.beginPath();g.moveTo(x,506);g.lineTo(x+3,474-m(j,3)*5);g.stroke();g.fillStyle='#f0c03a';g.beginPath();g.ellipse(x+3,472-m(j,3)*5,3,7,0,0,7);g.fill()})}
 if(k==3){g.fillStyle='#5ab8e8';g.fillRect(0,512,W,100);g.strokeStyle='rgba(255,255,255,.7)';g.beginPath();for(let x=0;x<=W;x+=10){const y=530+Math.sin(x*.05+t*.06)*3;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
  ti(.9,120,(x,j)=>{const y=545+m(j,3)*16;g.fillStyle='#4fc07a';g.beginPath();g.ellipse(x+30,y,28,8,0,0,7);g.fill();if(m(j,2)){g.fillStyle='#ff8fb1';g.beginPath();g.arc(x+30,y-8,6,0,7);g.fill()}})}
 if(k==4)ti(.5,200,(x,j)=>{g.fillStyle=['#fff','#ffe8f0','#e8f0ff'][m(j,3)];g.fillRect(x+30,420,76,82);g.fillStyle='#e8556a';g.beginPath();g.moveTo(x+22,421);g.lineTo(x+68,376);g.lineTo(x+114,421);g.fill();g.fillStyle='#b88a6a';g.fillRect(x+60,462,16,40);g.fillStyle='#8fd0ff';g.fillRect(x+38,436,14,14);g.fillRect(x+84,436,14,14)});
 if(k==5){g.lineWidth=9;['#ff6a6a','#ffb86a','#ffe86a','#7adf7a','#6ab8ff','#b88aff'].forEach((c,i)=>{g.strokeStyle=c;g.beginPath();g.arc(W*.62,430,210-i*9,Math.PI,0);g.stroke()});
  g.fillStyle='rgba(255,255,255,.8)';ti(.3,320,(x,j)=>{const y=230+m(j*37,90);g.beginPath();g.ellipse(x+80,y,70,26,0,0,7);g.ellipse(x+130,y-14,50,24,0,0,7);g.ellipse(x+40,y-8,40,20,0,0,7);g.fill()})}
 if(k==6){stars(45);g.fillStyle='#fff7c0';g.beginPath();g.arc(W*.2,130,28,0,7);g.fill();
  ti(.7,110,(x,j)=>{const y=110+m(j*37,70);g.strokeStyle='#caa';g.lineWidth=1.5;g.beginPath();g.moveTo(x+40,0);g.lineTo(x+40,y);g.stroke();g.shadowColor='#ffa030';g.shadowBlur=14;g.fillStyle='#ff9a3a';g.beginPath();g.ellipse(x+40,y+16,11,15,0,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#7a3a1a';g.fillRect(x+33,y,14,4)})}
 if(k==7){g.fillStyle='#ffd080';g.beginPath();g.arc(W*.75,380,62,0,7);g.fill();
  [[.35,90,'#6a4a6a',120],[.6,120,'#4a3a5a',80]].forEach(([sp,sz,c,hb])=>ti(sp,sz,(x,j)=>{const h=hb+m(j*53,100);g.fillStyle=c;g.fillRect(x+10,500-h,sz-30,h);g.fillStyle='rgba(255,230,140,.8)';for(let r=0;r<h/22-1;r++)for(let q=0;q<2;q++)if(m(j+r*3+q,3)==0)g.fillRect(x+20+q*24,500-h+10+r*22,10,10)}))}
 if(k==8)ti(.5,110,(x,j)=>{const h=90+m(j*29,70);g.globalAlpha=.85;g.fillStyle=m(j,2)?'#9be8ff':'#e0a8ff';g.beginPath();g.moveTo(x,502);g.lineTo(x+22,502-h);g.lineTo(x+44,502);g.fill();g.fillStyle='#ffd0ff';g.beginPath();g.moveTo(x+40,502);g.lineTo(x+62,502-h*.6);g.lineTo(x+84,502);g.fill();g.globalAlpha=1;g.fillStyle='#fff';g.fillRect(x+18,502-h+12,3,10)});
 if(k==9){stars(55);ti(.25,260,(x,j)=>{const py=250-m(j*41,60),hw=130*54/(502-py);g.fillStyle='#8a7ab8';g.beginPath();g.moveTo(x,502);g.lineTo(x+130,py);g.lineTo(x+260,502);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(x+130,py);g.lineTo(x+130-hw,py+54);g.lineTo(x+130+hw,py+54);g.fill()});
  g.lineWidth=16;g.globalAlpha=.22;['#6affd0','#ff9ad0'].forEach((c,q)=>{g.strokeStyle=c;g.beginPath();for(let x=0;x<=W;x+=14){const y=140+q*34+Math.sin(x*.02+t*.03+q)*18;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()});g.globalAlpha=1}
}
function mouse(x,e){
 const f=e.ty==2?(P&&P.x<e.x?-1:1):e.dir,c=['#b8b8cc','#c9a27a','#ff9a5a'][e.ty],K='#5a4a6a',w=Math.sin(t*.5+e.x)*2;
 g.save();g.translate(x+13,e.y);g.scale(f,1);g.translate(-13,0);
 g.lineWidth=2;g.strokeStyle=K;g.lineCap='round';
 g.beginPath();g.moveTo(2,18);g.quadraticCurveTo(-8,14+Math.sin(t*.3)*4,-6,6);g.stroke();

async function go(k){
 if(!hasTilt){
  try{
   if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){tiltMsg='Capteurs refusés par iOS';throw 0}}
   addEventListener('deviceorientation',ev=>{
    if(ev.gamma==null)return;tiltOn=true;tiltMsg='Inclinaison active';setUI();
    const a=(screen.orientation&&screen.orientation.angle)||0;
    tilt=a===90?-ev.beta:(a===270||a===-90)?ev.beta:ev.gamma;
   });hasTilt=true;setTimeout(()=>{if(!tiltOn&&!tiltMsg)tiltMsg='Aucun capteur reçu : ouvre le lien dans Safari/Chrome'},2000);
  }catch(e){}
 }
 if(!hasTilt&&!tiltMsg)tiltMsg='Capteurs bloqués : ouvre le lien dans Safari/Chrome';score=0;lives=3;start(k);
 setTimeout(setUI,600);
}
